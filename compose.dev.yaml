services:
  frontend:
    image: drone-analyze-frontend:development
    build:
      target: development
    environment:
      NODE_ENV: development
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app/frontend
          initial_sync: true
          ignore:
            - node_modules/
            - .next/
            - .git/
            - .env*
            - package.json
            - Dockerfile
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
        - action: rebuild
          path: ./frontend/Dockerfile
  gateway:
    image: drone-analyze-gateway:development
    build:
      target: development
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    develop:
      watch:
        - action: sync
          path: ./src/gateway
          target: /src
          initial_sync: true
          ignore:
            - '**/bin/'
            - '**/obj/'
            - Dockerfile
        - action: rebuild
          path: ./src/gateway/Dockerfile
  management:
    image: drone-analyze-management:development
    build:
      target: development
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    develop:
      watch:
        - action: sync
          path: ./src/services/Management
          target: /src
          initial_sync: true
          ignore:
            - '**/bin/'
            - '**/obj/'
            - Dockerfile
        - action: rebuild
          path: ./src/services/Management/Dockerfile
  checker:
    image: drone-analyze-checker:development
    build:
      target: development
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    develop:
      watch:
        - action: sync
          path: ./src/services/Checker
          target: /src
          initial_sync: true
          ignore:
            - '**/bin/'
            - '**/obj/'
            - Dockerfile
        - action: rebuild
          path: ./src/services/Checker/Dockerfile
